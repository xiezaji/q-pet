<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q Pet · 网页版</title>
<meta name="description" content="Q Pet，将你喜欢的角色放到桌面上。网页版试玩。">
<link rel="icon" href="assets/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E1E5EA">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="desk">
  <div class="desk-mark">
    <div class="dm-eyebrow">// Q PET · WEB</div>
    <div class="dm-title">Q Pet</div>
    <div class="dm-sub">将你喜欢的角色放到桌面上</div>
    <div class="dm-hint fine">点她说话 │ 拖动换位置 │ 右键打开菜单 │ 双击右下角图标打开设置</div>
    <div class="dm-hint coarse">点她说话 │ 拖动换位置 │ 点左下角 Q Pet 打开设置</div>
  </div>
  <div id="win-layer"></div>
  <div id="pet-layer"></div>
</div>
<div id="taskbar">
  <button class="tb-start" id="tb-start" title="打开设置"><img src="assets/icon.png" alt=""><span>Q Pet</span></button>
  <button class="tb-app" id="tb-app" hidden><img src="assets/icon.png" alt=""><span>Q Pet · 设置</span></button>
  <div class="tb-fill"></div>
  <a class="tb-link" href="https://github.com/xiezaji/q-pet" target="_blank" rel="noopener">GitHub</a>
  <a class="tb-link" href="https://github.com/xiezaji/q-pet/releases" target="_blank" rel="noopener">下载桌面版</a>
  <button class="tb-tray" id="tb-tray" title="Q Pet · 双击打开设置 · 右键菜单"><img src="assets/icon.png" alt=""></button>
  <div class="tb-clock" id="tb-clock"></div>
</div>
<div id="menu-layer"></div>
<div id="dlg-layer"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
